<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-to-Image AI Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #30363d;
        }

        h2 {
            margin-bottom: 15px;
            color: #58a6ff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 14px;
            color: #8b949e;
        }

        input[type="text"], input[type="file"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #238636;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2ea043;
        }

        .preview-box {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-top: 15px;
        }

        .img-card {
            flex: 1;
            background: #0d1117;
            border: 1px dashed #30363d;
            border-radius: 10px;
            padding: 10px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .img-card img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            display: none;
        }

        .loading {
            display: none;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔄 Image-to-Image AI Re-Generator</h2>
        
        <div class="input-group">
            <label>1. Apni Picture Upload Karein:</label>
            <input type="file" id="image-input" accept="image/*" onchange="previewUpload(event)">

            <label>2. Hugging Face Access Token (Free):</label>
            <input type="text" id="api-key-input" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx (HF Access Token)">

            <label>3. Command / Changes Likhein:</label>
            <input type="text" id="prompt-input" placeholder="e.g., Turn into 3D Pixar style anime baby, wearing a superhero suit">

            <button onclick="reGenerateImage()">Re-Generate Picture</button>
        </div>

        <div class="preview-box">
            <div class="img-card">
                <span id="original-text" style="color: #8b949e; font-size: 12px;">Original Picture</span>
                <img id="original-img" alt="Original Upload">
            </div>
            <div class="img-card">
                <span id="result-text" style="color: #8b949e; font-size: 12px;">AI Generated Picture</span>
                <p id="loading-text" class="loading">⏳ Re-generating photo...</p>
                <img id="generated-img" alt="AI Generated Output">
            </div>
        </div>
    </div>

    <script>
        let uploadedImageBlob = null;

        // Photo Upload Preview Handler
        function previewUpload(event) {
            const file = event.target.files[0];
            if (file) {
                uploadedImageBlob = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const origImg = document.getElementById('original-img');
                    origImg.src = e.target.result;
                    origImg.style.display = 'block';
                    document.getElementById('original-text').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        async function reGenerateImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const apiKey = document.getElementById('api-key-input').value.trim();
            const generatedImg = document.getElementById('generated-img');
            const loadingText = document.getElementById('loading-text');
            const resultText = document.getElementById('result-text');

            if (!uploadedImageBlob) {
                alert('Pehle apni photo upload karein!');
                return;
            }

            if (!prompt) {
                alert('Koi prompt/command likhein!');
                return;
            }

            if (!apiKey) {
                alert('Hugging Face ki Access Token enter karein!');
                return;
            }

            // Hide previous image & show loading
            generatedImg.style.display = 'none';
            resultText.style.display = 'none';
            loadingText.style.display = 'block';

            try {
                // Read uploaded image as Binary ArrayBuffer for API payload
                const imageBuffer = await uploadedImageBlob.arrayBuffer();

                // Hugging Face Image-to-Image / ControlNet Model Endpoint
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/lllyasviel/sd-controlnet-canny",
                    {
                        headers: {
                            Authorization: `Bearer ${apiKey}`,
                            "Content-Type": "application/octet-stream"
                        },
                        method: "POST",
                        body: imageBuffer
                    }
                );

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const resultBlob = await response.blob();
                const outputUrl = URL.createObjectURL(resultBlob);

                generatedImg.src = outputUrl;
                generatedImg.style.display = 'block';
                loadingText.style.display = 'none';

            } catch (error) {
                console.error(error);
                loadingText.style.display = 'none';
                resultText.innerText = '❌ Failed to process. Check API Token / Internet.';
                resultText.style.display = 'block';
            }
        }
    </script>
</body>
</html>
