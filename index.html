<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bus Simulator Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #111;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Dashboard UI (Speedometer & Controls) */
        .dashboard {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            color: #fff;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .speed-val {
            font-size: 32px;
            font-weight: bold;
            color: #58a6ff;
        }

        .unit {
            font-size: 14px;
            color: #8b949e;
        }

        .controls-hint {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.8);
            padding: 12px 20px;
            border-radius: 10px;
            color: #8b949e;
            font-size: 14px;
            border: 1px solid #30363d;
            z-index: 10;
        }

        .controls-hint b {
            color: #58a6ff;
        }

        /* Mobile On-Screen Touch Controls */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:active {
            background: rgba(88, 166, 255, 0.6);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="controls-hint">
        🚌 <b>Bus Controls:</b><br>
        Accelerate: <b>W / Up Arrow</b><br>
        Brake / Reverse: <b>S / Down Arrow</b><br>
        Steer Left/Right: <b>A / D</b> or <b>Left/Right Arrows</b>
    </div>

    <div class="dashboard">
        <div class="speed-val"><span id="speed">0</span> <span class="unit">KM/H</span></div>
        <div class="unit">Gear: <b id="gear" style="color:#2ea043;">D</b></div>
    </div>

    <!-- Touch Buttons for Mobile -->
    <div class="touch-controls">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-brake">🛑</div>
        <div class="btn" id="btn-gas">🚀</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, bus, wheels = [];
        let speed = 0;
        let angle = 0;
        let maxSpeed = 1.2;
        let acceleration = 0.015;
        let friction = 0.98;
        let steeringSensitivity = 0.03;

        const keys = { forward: false, backward: false, left: false, right: false };

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Environment (Road & Grass Ground)
            createEnvironment();

            // 6. Create 3D Indonesian Style Bus Model
            createBus();

            // Event Listeners
            window.addEventListener('keydown', (e) => handleKeys(e, true));
            window.addEventListener('keyup', (e) => handleKeys(e, false));
            window.addEventListener('resize', onWindowResize);

            setupTouchControls();

            // Start Game Loop
            animate();
        }

        function createEnvironment() {
            // Grass Ground
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Long Highway Road
            const roadGeo = new THREE.PlaneGeometry(16, 1000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.01;
            scene.add(road);

            // Road Lines
            for (let i = -500; i < 500; i += 20) {
                const lineGeo = new THREE.PlaneGeometry(0.5, 8);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, i);
                scene.add(line);
            }

            // Trees along the road
            for (let i = -400; i < 400; i += 30) {
                createTree(-15, i);
                createTree(15, i);
            }
        }

        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 4);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2, z);

            const leavesGeo = new THREE.ConeGeometry(3, 7, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x006400 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 6, z);

            scene.add(trunk);
            scene.add(leaves);
        }

        function createBus() {
            bus = new THREE.Group();

            // Bus Main Body (Red/White Indonesian Bus style)
            const bodyGeo = new THREE.BoxGeometry(2.5, 2.8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xda251c }); // BUSSID Red Color
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.8;
            body.castShadow = true;
            bus.add(body);

            // Bus Roof
            const roofGeo = new THREE.BoxGeometry(2.4, 0.2, 7.8);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 3.2;
            bus.add(roof);

            // Windows (Front & Sides Glass)
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

            // Front Windshield
            const frontGlassGeo = new THREE.BoxGeometry(2.3, 1.2, 0.1);
            const frontGlass = new THREE.Mesh(frontGlassGeo, glassMat);
            frontGlass.position.set(0, 2.3, 3.96);
            bus.add(frontGlass);

            // Side Windows
            const sideGlassGeo = new THREE.BoxGeometry(2.52, 1, 6.5);
            const sideGlass = new THREE.Mesh(sideGlassGeo, glassMat);
            sideGlass.position.set(0, 2.3, 0);
            bus.add(sideGlass);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.5, 0.3, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.8, 1, 4.01);
            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.8, 1, 4.01);
            bus.add(leftLight);
            bus.add(rightLight);

            // Wheels (4 Wheels)
            const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.5, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const wheelPositions = [
                [-1.3, 0.6, 2.5],  // Front Left
                [1.3, 0.6, 2.5],   // Front Right
                [-1.3, 0.6, -2.5], // Rear Left
                [1.3, 0.6, -2.5]   // Rear Right
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                bus.add(wheel);
                wheels.push(wheel);
            });

            scene.add(bus);
        }

        function handleKeys(e, isPressed) {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.forward = isPressed;
            if (e.key === 's' || e.key === 'ArrowDown') keys.backward = isPressed;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = isPressed;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = isPressed;
        }

        function setupTouchControls() {
            const bindTouch = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            };
            bindTouch('btn-gas', 'forward');
            bindTouch('btn-brake', 'backward');
            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');
        }

        function updatePhysics() {
            // Acceleration & Braking
            if (keys.forward) {
                if (speed < maxSpeed) speed += acceleration;
            } else if (keys.backward) {
                if (speed > -maxSpeed / 2) speed -= acceleration;
            } else {
                speed *= friction; // Natural Slowdown
            }

            // Steering
            if (Math.abs(speed) > 0.01) {
                const dir = speed > 0 ? 1 : -1;
                if (keys.left) angle += steeringSensitivity * dir;
                if (keys.right) angle -= steeringSensitivity * dir;
            }

            // Move Bus position
            bus.rotation.y = angle;
            bus.position.x += Math.sin(angle) * speed;
            bus.position.z += Math.cos(angle) * speed;

            // Rotate Wheels
            wheels.forEach(w => w.rotation.x += speed * 0.5);

            // Update Camera Third-Person Tracking (Smooth follow camera)
            const cameraOffset = new THREE.Vector3(0, 5, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            camera.position.x = bus.position.x + cameraOffset.x;
            camera.position.y = bus.position.y + cameraOffset.y;
            camera.position.z = bus.position.z + cameraOffset.z;
            camera.lookAt(bus.position.x, bus.position.y + 1.5, bus.position.z);

            // Update Dashboard UI
            const speedKmh = Math.floor(Math.abs(speed) * 90);
            document.getElementById('speed').innerText = speedKmh;
            document.getElementById('gear').innerText = speed >= 0 ? 'D' : 'R';
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
