<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 1px solid #30363d;
        }

        h2 {
            margin-bottom: 20px;
            color: #58a6ff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #238636;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        .video-box {
            margin-top: 20px;
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #30363d;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background-color: #0d1117;
        }

        img.output-video {
            width: 100%;
            height: auto;
            display: none;
            border-radius: 10px;
        }

        .loading {
            display: none;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 AI Text-to-Video Generator</h2>
        
        <div class="input-group">
            <input type="text" id="prompt-input" placeholder="Yahan command likhein (e.g. A cute baby playing with a glowing ball, cinematic 8k)...">
            <button onclick="generateVideo()">Video Banayein</button>
        </div>

        <div class="video-box">
            <p id="placeholder-text" style="color: #8b949e;">Aap ki AI Video yahan nazar aaye gi</p>
            <p id="loading-text" class="loading">⏳ Video ban rahi hai, thoda intazar karein...</p>
            <img id="generated-video" class="output-video" alt="AI Generated Animation/Video">
        </div>
    </div>

    <script>
        function generateVideo() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const videoElement = document.getElementById('generated-video');
            const placeholderText = document.getElementById('placeholder-text');
            const loadingText = document.getElementById('loading-text');

            if (!prompt) {
                alert('Meherbani karke koi command/prompt likhein!');
                return;
            }

            // Hide old media & show loading state
            videoElement.style.display = 'none';
            placeholderText.style.display = 'none';
            loadingText.style.display = 'block';

            // Clean prompt string for URL
            const encodedPrompt = encodeURIComponent(prompt);
            
            // Random seed logic so every video generation is unique
            const randomSeed = Math.floor(Math.random() * 100000);

            // Pollinations Video/Animation URL (Free, no API Key required)
            const videoUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${randomSeed}&nologo=true&model=turbo`;

            // Load generated video sequence
            videoElement.src = videoUrl;

            videoElement.onload = function() {
                loadingText.style.display = 'none';
                videoElement.style.display = 'block';
            };

            videoElement.onerror = function() {
                loadingText.style.display = 'none';
                placeholderText.innerText = '❌ Video banane me masla hua. Dobara koshish karein.';
                placeholderText.style.display = 'block';
            };
        }
    </script>
</body>
</html>
