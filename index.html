<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real AI Animated Video Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #161b22;
            padding: 15px 30px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #58a6ff;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 360px;
            background: #161b22;
            padding: 25px;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 600;
        }

        input, select, textarea {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #58a6ff;
        }

        .btn-render {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-render:hover {
            opacity: 0.9;
        }

        .workspace {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-box {
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            display: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .status-msg {
            color: #8b949e;
            text-align: center;
        }

        .controls-bar {
            margin-top: 20px;
            display: none;
            gap: 15px;
        }

        .btn-download {
            background: #1f6beb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <i class="fa-solid fa-video"></i> Real MP4 Video Render Studio
    </header>

    <div class="main-container">
        <!-- Controls Panel -->
        <div class="sidebar">
            <div class="form-group">
                <label>Video Title / Overlay Text</label>
                <input type="text" id="video-text" value="Futuristic Cyber Motion" placeholder="Video ka Text likhein">
            </div>

            <div class="form-group">
                <label>Animation Motion Style</label>
                <select id="motion-style">
                    <option value="particles">Cyber Cosmic Wormhole</option>
                    <option value="waves">Neon Wave Motion</option>
                    <option value="matrix">Matrix Digital Rain</option>
                </select>
            </div>

            <div class="form-group">
                <label>Video Color Theme</label>
                <select id="color-theme">
                    <option value="cyan">Neon Cyan & Purple</option>
                    <option value="gold">Gold & Sunset Glow</option>
                    <option value="green">Matrix Cyber Green</option>
                </select>
            </div>

            <div class="form-group">
                <label>Duration (Seconds)</label>
                <select id="duration">
                    <option value="5">5 Seconds</option>
                    <option value="8">8 Seconds</option>
                    <option value="10">10 Seconds</option>
                </select>
            </div>

            <button class="btn-render" onclick="startVideoRender()">
                <i class="fa-solid fa-gear"></i> Render Real Video (MP4/WebM)
            </button>
        </div>

        <!-- Video Display Screen -->
        <div class="workspace">
            <div class="preview-box">
                <div id="status" class="status-msg">
                    <i class="fa-solid fa-clapperboard" style="font-size: 40px; margin-bottom: 10px;"></i><br>
                    Settings select karke "Render Real Video" par click karein.
                </div>
                <canvas id="render-canvas" width="1280" height="720"></canvas>
                <video id="output-video" controls></video>
            </div>

            <div class="controls-bar" id="controls-bar">
                <button class="btn-download" onclick="downloadVideo()">
                    <i class="fa-solid fa-download"></i> Download Video File
                </button>
            </div>
        </div>
    </div>

    <script>
        let canvas = document.getElementById('render-canvas');
        let ctx = canvas.getContext('2d');
        let videoElement = document.getElementById('output-video');
        let statusText = document.getElementById('status');
        let controlsBar = document.getElementById('controls-bar');
        
        let mediaRecorder;
        let recordedChunks = [];
        let videoBlobUrl = '';

        function startVideoRender() {
            let text = document.getElementById('video-text').value;
            let style = document.getElementById('motion-style').value;
            let theme = document.getElementById('color-theme').value;
            let duration = parseInt(document.getElementById('duration').value);

            statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="font-size:40px;"></i><br>Real Video Frames Render ho rahe hain...';
            videoElement.style.display = 'none';
            controlsBar.style.display = 'none';
            recordedChunks = [];

            // Setup Canvas Media Stream to Record Real Video
            let stream = canvas.captureStream(30); // 30 FPS
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                let blob = new Blob(recordedChunks, { type: 'video/webm' });
                videoBlobUrl = URL.createObjectURL(blob);
                videoElement.src = videoBlobUrl;
                videoElement.style.display = 'block';
                statusText.style.display = 'none';
                controlsBar.style.display = 'flex';
            };

            mediaRecorder.start();

            // Render Animation loop for duration
            let startTime = performance.now();
            let totalFrames = duration * 30;
            let currentFrame = 0;

            function animate(currentTime) {
                let elapsedTime = (currentTime - startTime) / 1000;
                
                // Draw Canvas Animation
                drawFrame(style, theme, text, elapsedTime);

                currentFrame++;
                if (elapsedTime < duration) {
                    requestAnimationFrame(animate);
                } else {
                    mediaRecorder.stop();
                }
            }

            requestAnimationFrame(animate);
        }

        function drawFrame(style, theme, text, time) {
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Set Palette
            let primaryColor = '#00f0ff';
            let secondaryColor = '#7000ff';

            if (theme === 'gold') {
                primaryColor = '#ffb703';
                secondaryColor = '#fb8500';
            } else if (theme === 'green') {
                primaryColor = '#00ff66';
                secondaryColor = '#003311';
            }

            // Motion Style 1: Particles Wormhole
            if (style === 'particles') {
                for (let i = 0; i < 150; i++) {
                    let angle = i * 0.1 + time * 2;
                    let radius = (i * 4 + time * 100) % 500;
                    let x = canvas.width / 2 + Math.cos(angle) * radius;
                    let y = canvas.height / 2 + Math.sin(angle) * radius;

                    ctx.beginPath();
                    ctx.arc(x, y, (radius / 50) + 1, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? primaryColor : secondaryColor;
                    ctx.fill();
                }
            } 
            // Motion Style 2: Neon Waves
            else if (style === 'waves') {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                for (let x = 0; x < canvas.width; x += 10) {
                    let y = canvas.height / 2 + Math.sin(x * 0.01 + time * 3) * 80 + Math.cos(time * 2) * 40;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            // Text Render
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px Segoe UI';
            ctx.textAlign = 'center';
            ctx.shadowColor = primaryColor;
            ctx.shadowBlur = 20;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 15);
            ctx.shadowBlur = 0;
        }

        function downloadVideo() {
            if (!videoBlobUrl) return;
            let a = document.createElement('a');
            a.href = videoBlobUrl;
            a.download = `Generated_Video_${Date.now()}.webm`;
            a.click();
        }
    </script>
</body>
</html>
