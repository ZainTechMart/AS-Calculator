<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #30363d;
        }

        h2 {
            margin-bottom: 20px;
            color: #58a6ff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #238636;
            color: #white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        .image-box {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #30363d;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        img {
            width: 100%;
            height: auto;
            display: none;
            border-radius: 10px;
        }

        .loading {
            display: none;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎨 AI Image Generator</h2>
        
        <div class="input-group">
            <input type="text" id="prompt-input" placeholder="Yahan apni command likhein (e.g. A cute baby playing with a cat)...">
            <button onclick="generateImage()">Picture Banayein</button>
        </div>

        <div class="image-box">
            <p id="placeholder-text" style="color: #8b949e;">Aap ki picture yahan nazar aaye gi</p>
            <p id="loading-text" class="loading">⏳ Picture ban rahi hai, thoda intazar karein...</p>
            <img id="generated-img" alt="AI Generated Image">
        </div>
    </div>

    <script>
        function generateImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const imgElement = document.getElementById('generated-img');
            const placeholderText = document.getElementById('placeholder-text');
            const loadingText = document.getElementById('loading-text');

            if (!prompt) {
                alert('Meherbani karke koi command/text likhein!');
                return;
            }

            // Hide old image & show loading
            imgElement.style.display = 'none';
            placeholderText.style.display = 'none';
            loadingText.style.display = 'block';

            // Clean prompt for URL
            const encodedPrompt = encodeURIComponent(prompt);
            
            // Pollinations AI URL (Free & No API Key required)
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true`;

            // Load new image
            imgElement.src = imageUrl;

            imgElement.onload = function() {
                loadingText.style.display = 'none';
                imgElement.style.display = 'block';
            };

            imgElement.onerror = function() {
                loadingText.style.display = 'none';
                placeholderText.innerText = '❌ Picture banane me masla hua. Dobara koshish karein.';
                placeholderText.style.display = 'block';
            };
        }
    </script>
</body>
</html>
